name: post reels (2x daily)

# One main run a day schedules everything for the next ~24 hours in Buffer:
#   reel a 4:30pm ET, reel b 8pm ET (Instagram + YouTube), X at 6pm, 9:30pm and 6:15am ET.
# GitHub's scheduled runs can start hours late or get skipped, so there's a backup run;
# anything already scheduled is skipped, so nothing double-posts.
on:
  schedule:
    - cron: '0 12 * * *' # main (7am ET)
    - cron: '0 15 * * *' # backup (10am ET)
  workflow_dispatch:
    inputs:
      dry:
        description: 'Dry run (fake voice, no Buffer posts)'
        type: boolean
        default: false
      stats_only:
        description: 'Only refresh status/performance.md'
        type: boolean
        default: false
      inspect:
        description: 'Only print Buffer API schema (debug)'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_try.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video/package-lock.json

      - name: Install
        working-directory: video
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          npm ci
          npx remotion browser ensure

      - name: Inspect Buffer schema
        if: ${{ inputs.inspect }}
        working-directory: video
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: node pipeline/inspect.mjs && exit 1

      - name: Make videos
        id: make
        if: ${{ !inputs.stats_only }}
        working-directory: video
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: node pipeline/make.mjs ${{ inputs.dry && '--dry' || '' }}

      - name: Make X cards
        id: cards
        if: ${{ !inputs.stats_only && !inputs.dry }}
        working-directory: video
        run: node pipeline/cards.mjs

      - name: Upload media to GitHub Pages
        if: steps.make.outputs.ready == 'true' || steps.cards.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # GitHub sometimes can't see a just-uploaded artifact yet (failed run on 2026-11-20), so retry once after a pause.
      - name: Deploy GitHub Pages
        id: deploy_try
        if: steps.make.outputs.ready == 'true' || steps.cards.outputs.ready == 'true'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retrying deploy
        if: steps.deploy_try.outcome == 'failure'
        run: sleep 30

      - name: Deploy GitHub Pages (retry)
        id: deploy
        if: steps.deploy_try.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Send to Buffer
        if: ${{ !inputs.dry && !inputs.stats_only }}
        working-directory: video
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: node pipeline/publish.mjs

      - name: Update performance stats
        if: ${{ !inputs.dry && !inputs.inspect }}
        continue-on-error: true
        working-directory: video
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: node pipeline/stats.mjs

      - name: Note failure in log
        if: failure()
        run: |
          mkdir -p status
          [ -f status/log.md ] || printf '# Posting log\n\nNewest at the bottom.\n\n' > status/log.md
          echo "- $(date -u '+%F %H:%M') UTC — ❌ run failed (see the GitHub email / Actions tab for details)" >> status/log.md

      - name: Save queue + log
        if: always()
        run: |
          git config user.name "localhost-bot"
          git config user.email "localhost-bot@users.noreply.github.com"
          git add content status media || true
          git diff --cached --quiet || git commit -m "post: $(date -u +%F\ %H:%M)"
          git pull --rebase -q || true
          git push || true
